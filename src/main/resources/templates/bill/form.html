
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bill Form</title>
</head>
<body>

<h1 th:text="${bill.id == null ? 'Generate New Bill' : 'Edit Bill'}"></h1>

<form th:action="${bill.id == null ? '/bill' : '/bill/edit'}"
      th:object="${bill}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="orderId">Order ID:</label><br>
        <input type="text" id="orderId" th:field="*{orderId}" required>
    </div>

    <br>

    <button type="submit"
            th:text="${bill.id == null ? 'Generate' : 'Update'}">
    </button>

    <a th:href="@{/bill}">Cancel</a>

</form>

</body>
</html>
