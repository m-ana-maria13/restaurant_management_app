
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bill List</title>
</head>
<body>

<h1>Bill List</h1>

<p>
    <a th:href="@{/bill/new}">Generate New Bill</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Order ID</th>
        <th>Total Amount</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${bills}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.orderId}"></td>
        <td th:text="${item.totalAmount}"></td>

        <td>
            <form th:action="@{/bill/details/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>

            <form th:action="@{/bill/edit/{id}(id=${item.id})}" method="get">
                <button type="submit">Edit</button>
            </form>

            <form th:action="@{/bill/{id}/delete(id=${item.id})}" method="post">
                <button type="submit">Delete</button>
            </form>

            <form th:action="@{/bill/{id}/pay(id=${item.orderId})}" method="post">
                <button type="submit">Pay Bill</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
