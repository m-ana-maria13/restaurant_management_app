<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Chef</title>
</head>
<body>
<h1>Add New Chef</h1>

<!-- th:object="${chef}" conectează formularul la obiectul pasat din Controller -->
<!-- th:action="@{/chef}" trimite cererea POST către salvare -->
<form th:action="@{/chef}" th:object="${chef}" method="post">
    <div>
        <label for="name">Name:</label><br>
        <!-- th:field="*{name}" setează automat atributul "name" al obiectului Chef -->
        <input type="text" id="name" th:field="*{name}" required />
    </div>
    <br>

    <div>
        <label for="specialization">Specialization:</label><br>
        <!-- th:field="*{specialization}" setează atributul "specialization" -->
        <input type="text" id="specialization" th:field="*{specialization}" required />
    </div>
    <br>

    <button type="submit">Save</button>
    <a th:href="@{/chef}">Cancel</a>
</form>
</body>
</html>
