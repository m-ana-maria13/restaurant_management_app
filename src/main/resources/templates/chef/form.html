
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chef Form</title>
</head>
<body>

<h1 th:text="${chef.id == null ? 'Add New Chef' : 'Edit Chef'}"></h1>

<form th:action="${chef.id == null ? '/chef' : '/chef/edit'}"
      th:object="${chef}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <br>

    <div>
        <label for="specialization">Specialization:</label><br>
        <input type="text" id="specialization" th:field="*{specialization}" required>
    </div>

    <br>

    <button type="submit"
            th:text="${chef.id == null ? 'Save' : 'Update'}">
    </button>

    <a th:href="@{/chef}">Cancel</a>

</form>

</body>
</html>
