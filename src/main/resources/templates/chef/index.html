
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chef List</title>
</head>
<body>

<h1>Chef List</h1>

<p>
    <a th:href="@{/chef/new}">Add New Chef</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Specialization</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${chefs}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.specialization}"></td>

        <td>
            <form th:action="@{/chef/details/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>

            <form th:action="@{/chef/edit/{id}(id=${item.id})}" method="get">
                <button type="submit">Edit</button>
            </form>

            <form th:action="@{/chef/{id}/delete(id=${item.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
