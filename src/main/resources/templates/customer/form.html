
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Form</title>
</head>
<body>

<h1 th:text="${customer.id == null ? 'Register New Customer' : 'Edit Customer'}"></h1>

<form th:action="${customer.id == null ? '/customer' : '/customer/edit'}"
      th:object="${customer}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <br>

    <div>
        <label for="discount">Discount:</label><br>
        <input type="number" id="discount" th:field="*{discount}" step="0.01" required>
    </div>

    <br>

    <button type="submit"
            th:text="${customer.id == null ? 'Register' : 'Update'}">
    </button>

    <a th:href="@{/customer}">Cancel</a>

</form>

</body>
</html>
