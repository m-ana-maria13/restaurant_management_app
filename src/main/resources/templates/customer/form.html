<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
</head>
<body>
<h1>Add New Customer</h1>

<!-- th:object="${customer}" conectează formularul la obiectul pasat din Controller -->
<!-- th:action="@{/customer}" trimite cererea POST către salvare -->
<form th:action="@{/customer}" th:object="${customer}" method="post">
    <div>
        <label for="name">Name:</label><br>
        <!-- th:field="*{name}" setează automat atributul "name" al obiectului Customer -->
        <input type="text" id="name" th:field="*{name}" required />
    </div>
    <br>

    <div>
        <label for="discount">Discount (%):</label><br>
        <!-- th:field="*{discount}" setează atributul "discount"; validat între 0 și 70 în CustomerService -->
        <input type="number" id="discount" th:field="*{discount}" min="0" max="70" step="0.01" required />
    </div>
    <br>

    <button type="submit">Save</button>
    <a th:href="@{/customer}">Cancel</a>
</form>
</body>
</html>
