
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer List</title>
</head>
<body>

<h1>Customer List</h1>

<p>
    <a th:href="@{/customer/new}">Register New Customer</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Discount</th>
        <th>Orders</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${customers}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.discount}"></td>
        <td th:text="${item.orders.size()}"></td>

        <td>
            <form th:action="@{/customer/details/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>

            <form th:action="@{/customer/edit/{id}(id=${item.id})}" method="get">
                <button type="submit">Edit</button>
            </form>

            <form th:action="@{/customer/{id}/delete(id=${item.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
