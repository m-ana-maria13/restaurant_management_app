<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer List</title>
</head>
<body>
<h1>Customer List</h1>

<!-- Buton/link către formularul de adăugare -->
<p>
    <a th:href="@{/customer/new}">Add New Customer</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Discount (%)</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterează prin colecția "customers" trimisă de CustomerController -->
    <tr th:each="item : ${customers}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.name}">John Doe</td>
        <td th:text="${item.discount}">0.0</td>
        <td>
            <!-- Formular POST pentru ștergere -->
            <form th:action="@{'/customer/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
