
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu Item Form</title>
</head>
<body>

<h1 th:text="${menuItem.id == null ? 'Add New Menu Item' : 'Edit Menu Item'}"></h1>

<form th:action="${menuItem.id == null ? '/menuItem' : '/menuItem/edit'}"
      th:object="${menuItem}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <br>

    <div>
        <label for="price">Price:</label><br>
        <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required>
    </div>

    <br>

    <button type="submit"
            th:text="${menuItem.id == null ? 'Save' : 'Update'}">
    </button>

    <a th:href="@{/menuItem}">Cancel</a>

</form>

</body>
</html>
