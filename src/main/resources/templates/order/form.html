
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
</head>
<body>

<h1 th:text="${order.id == null ? 'Create New Order' : 'Edit Order'}"></h1>

<form th:action="${order.id == null ? '/order' : '/order/edit'}"
      th:object="${order}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="customerId">Customer ID:</label><br>
        <input type="text" id="customerId" th:field="*{customerId}" required>
    </div>

    <br>

    <div>
        <label for="tableId">Table ID:</label><br>
        <input type="text" id="tableId" th:field="*{tableId}" required>
    </div>

    <br>

    <div>
        <label for="takeAway">Take Away:</label><br>
        <input type="checkbox" id="takeAway" th:field="*{takeAway}">
    </div>

    <br>

    <button type="submit"
            th:text="${order.id == null ? 'Save' : 'Update'}">
    </button>

    <a th:href="@{/order}">Cancel</a>

</form>

</body>
</html>
