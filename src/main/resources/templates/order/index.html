
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
</head>
<body>

<h1>Order List</h1>

<p>
    <a th:href="@{/order/new}">Create New Order</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Customer ID</th>
        <th>Table ID</th>
        <th>Take Away</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${orders}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.customerId}"></td>
        <td th:text="${item.tableId}"></td>
        <td th:text="${item.takeAway}"></td>
        <td th:text="${item.status}"></td>


        <td>
            <form th:action="@{/order/details/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>

            <form th:action="@{/order/edit/{id}(id=${item.id})}" method="get">
                <button type="submit">Edit</button>
            </form>

            <form th:action="@{/order/{id}/delete(id=${item.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
