
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Server Form</title>
</head>
<body>

<h1 th:text="${server.id == null ? 'Add New Server' : 'Edit Server'}"></h1>

<form th:action="${server.id == null ? '/server' : '/server/edit'}"
      th:object="${server}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="name">Name:</label><br>
        <input type="text" id="name" th:field="*{name}" required>
    </div>

    <br>

    <div>
        <label for="designation">Designation:</label><br>
        <input type="text" id="designation" th:field="*{designation}" required>
    </div>

    <br>

    <button type="submit"
            th:text="${server.id == null ? 'Save' : 'Update'}">
    </button>

    <a th:href="@{/server}">Cancel</a>

</form>

</body>
</html>
