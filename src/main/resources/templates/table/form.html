
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Table Form</title>
</head>
<body>

<h1 th:text="${table.id == null ? 'Add New Table' : 'Edit Table'}"></h1>

<form th:action="${table.id == null ? '/table' : '/table/edit'}"
      th:object="${table}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="numberPeople">Number of People:</label><br>
        <input type="number" id="numberPeople"
               th:field="*{numberPeople}" min="1" required>
    </div>

    <br>

    <button type="submit"
            th:text="${table.id == null ? 'Save' : 'Update'}">
    </button>

    <a th:href="@{/table}">Cancel</a>

</form>

</body>
</html>
