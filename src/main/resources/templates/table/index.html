<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Table List</title>
</head>
<body>
<h1>Table List</h1>

<!-- Buton/link către formularul de adăugare -->
<p>
    <a th:href="@{/table/new}">Add New Table</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Number</th>
        <th>People</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterează prin colecția "tables" trimisă de TableController -->
    <tr th:each="item : ${tables}">
        <td th:text="${item.id}">1</td>
        <td th:text="${item.number}">1</td>
        <td th:text="${item.numberPeople}">4</td>
        <td th:text="${item.occupiedStatus}">FREE</td>
        <td>
            <!-- Formular POST pentru ștergere -->
            <form th:action="@{'/table/' + ${item.id} + '/delete'}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
