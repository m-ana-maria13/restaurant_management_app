
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Table List</title>
</head>
<body>

<h1>Table List</h1>

<p>
    <a th:href="@{/table/new}">Add New Table</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Number of People</th>
        <th>Occupied Status</th>
        <th>Orders</th>
        <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="item : ${tables}">
        <td th:text="${item.id}"></td>
        <td th:text="${item.numberPeople}"></td>
        <td th:text="${item.occupiedStatus}"></td>
        <td th:text="${item.orders != null ? item.orders.size() : 0}"></td>

        <td>
            <form th:action="@{/table/details/{id}(id=${item.id})}" method="get">
                <button type="submit">Details</button>
            </form>

            <form th:action="@{/table/edit/{id}(id=${item.id})}" method="get">
                <button type="submit">Edit</button>
            </form>

            <form th:action="@{/table/{id}/delete(id=${item.id})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
